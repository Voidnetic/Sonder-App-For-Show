name: sonder_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  camera: ^0.12.2
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter:
    sdk: flutter
  google_sign_in: ^7.2.0
  http: ^1.2.2
  http_parser: ^4.1.0
  image_picker: ^1.1.2
  path_provider: ^2.1.6
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.3
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/brand/

  # Both fonts are SIL Open Font License; the licences are next to the files.
  fonts:
    - family: Bagel
      fonts:
        - asset: assets/fonts/BagelFatOne.ttf
    - family: Bricolage
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Regular.ttf
        - asset: assets/fonts/BricolageGrotesque-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 900
