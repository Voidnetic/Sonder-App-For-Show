# Builds an installable Android APK on GitHub's servers.
# Download it from the "Sonder APK (latest build)" release on the repo's Releases page,
# or from the "sonder-apk" artifact of the workflow run.
name: Build Android APK

on:
  push:
    branches: [main, master, "claude/**"]
    paths-ignore: ["backend/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk sonder.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sonder-apk
          path: sonder.apk

      - name: Publish to the "apk-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest sonder.apk \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Sonder APK (latest build)" \
            --notes "Built from ${{ github.ref_name }} @ ${{ github.sha }}. Open this page on your Android phone, tap sonder.apk, then allow installing from your browser."
