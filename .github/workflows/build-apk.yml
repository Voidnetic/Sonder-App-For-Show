# Builds an installable Android APK on GitHub's servers.
# Download it from the "Sonder APK (latest build)" release on the repo's Releases page,
# or from the "sonder-apk" artifact of the workflow run.
name: Build Android APK

on:
  push:
    branches: [main, master, "claude/**"]
    paths-ignore: ["backend/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Optional secrets (Settings > Secrets and variables > Actions). Without them the APK is signed with a
      # throwaway debug key and Google sign-in shows "not set up". See PLAY_STORE.md.
      - name: Set up release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret: signing with the debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } > android/key.properties

      - name: Build release APK
        env:
          GOOGLE_SERVER_CLIENT_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID }}
          SONDER_API_URL: ${{ vars.SONDER_API_URL }}
        run: |
          ARGS=()
          if [ -n "$GOOGLE_SERVER_CLIENT_ID" ]; then ARGS+=(--dart-define=GOOGLE_SERVER_CLIENT_ID=$GOOGLE_SERVER_CLIENT_ID); fi
          if [ -n "$SONDER_API_URL" ]; then ARGS+=(--dart-define=SONDER_API_URL=$SONDER_API_URL); fi
          flutter build apk --release "${ARGS[@]}"

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk sonder.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sonder-apk
          path: sonder.apk

      - name: Publish to the "apk-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest sonder.apk \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Sonder APK (latest build)" \
            --notes "Built from ${{ github.ref_name }} @ ${{ github.sha }}. Open this page on your Android phone, tap sonder.apk, then allow installing from your browser."
