# Builds an unsigned iPhone app (.ipa) on GitHub's Mac servers (free for public repos).
# Download it from the "Sonder iPhone (latest build)" release, then install it with Sideloadly using your
# Apple ID (see IOS.md). Apple makes apps installed this way stop opening after 7 days; reinstall to renew.
name: Build iPhone IPA

on:
  push:
    branches: [main, master, "claude/**"]
    paths-ignore: ["backend/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ipa
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - run: flutter pub get

      # Optional (Settings > Secrets and variables > Actions > Variables): the iOS OAuth client from
      # Google Cloud, so "Continue with Google" works on iPhone. Without it the button says it isn't set up.
      - name: Add the Google sign-in client for iOS
        env:
          GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
        run: |
          if [ -z "$GOOGLE_IOS_CLIENT_ID" ]; then
            echo "No GOOGLE_IOS_CLIENT_ID variable: Google sign-in stays off on iPhone."
            exit 0
          fi
          PLIST=ios/Runner/Info.plist
          REVERSED=$(echo "$GOOGLE_IOS_CLIENT_ID" | awk -F. '{for (i=NF; i>0; i--) printf "%s%s", $i, (i>1 ? "." : "")}')
          /usr/libexec/PlistBuddy -c "Add :GIDClientID string $GOOGLE_IOS_CLIENT_ID" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string $REVERSED" "$PLIST"

      - name: Build the app (unsigned: Sideloadly signs it with your Apple ID)
        env:
          SONDER_API_URL: ${{ vars.SONDER_API_URL }}
          GOOGLE_SERVER_CLIENT_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID }}
          GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
        run: |
          ARGS=()
          for NAME in SONDER_API_URL GOOGLE_SERVER_CLIENT_ID GOOGLE_IOS_CLIENT_ID; do
            if [ -n "${!NAME}" ]; then ARGS+=("--dart-define=$NAME=${!NAME}"); fi
          done
          flutter build ios --release --no-codesign "${ARGS[@]}"

      - name: Package as .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry sonder.ipa Payload
          ls -lh sonder.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: sonder-ipa
          path: sonder.ipa

      - name: Publish to the "ipa-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ipa-latest --yes --cleanup-tag || true
          gh release create ipa-latest sonder.ipa \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Sonder iPhone (latest build)" \
            --notes "Built from ${{ github.ref_name }} @ ${{ github.sha }}. Download sonder.ipa on a Windows PC or Mac and install it with Sideloadly (see IOS.md in the repo)."
